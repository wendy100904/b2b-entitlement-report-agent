name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑离线测试（工具循环 + 数据库持久化）
        run: python -m pytest test_offline.py -q

      - name: 验证应用可导入
        run: python -c "from backend.main import app; print('app OK')"
