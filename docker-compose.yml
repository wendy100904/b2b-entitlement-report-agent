services:
  entitlement-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/entitlement.db}
    volumes:
      - entitlement-data:/app/data

volumes:
  entitlement-data:
